[package]
name = "tf2-sound-studio"
version = "1.0.4"
edition = "2021"
description = "TF2 sound editor - mute, amplify, replace sound waves in the game VPKs"

[dependencies]
eframe = "0.29"
egui = "0.29"
winreg = "0.52"
rfd = "0.15"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
